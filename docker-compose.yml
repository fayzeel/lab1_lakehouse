version: '3.8'

services:
  # PostgreSQL - метаданные Lakekeeper
  lakehouse-pg:
    image: postgres:17
    container_name: lakehouse-pg
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (Silo) - объектное хранилище
  lakehouse-minio:
    image: pgsty/silo:latest
    container_name: lakehouse-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  # Lakekeeper - Iceberg REST Catalog
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: lakekeeper
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "This-is-NOT-Secure!"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://postgres:postgres@lakehouse-pg:5432/postgres"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://postgres:postgres@lakehouse-pg:5432/postgres"
    ports:
      - "8181:8181"
    depends_on:
      lakehouse-pg:
        condition: service_healthy
    command: serve

  # Trino - SQL-движок
  trino:
    image: trinodb/trino:476
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./catalog:/etc/trino/catalog
    depends_on:
      - lakekeeper
      - lakehouse-minio

volumes:
  pg-data:
  minio-data:
